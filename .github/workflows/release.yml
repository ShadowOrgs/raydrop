name: Release Raydrop Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Disable Spotlight on macOS (prevents hdiutil Resource busy)
        if: matrix.platform == 'macos-latest'
        run: sudo mdutil -a -i off || true

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Raydrop v__VERSION__'
          releaseBody: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/asepindrak/raydrop/main/assets/logo.png" alt="Raydrop Logo" width="220" />
            </p>

            <h2 align="center">Raydrop v__VERSION__ Release</h2>

            <p align="center">
              <strong>Universal P2P File Transfer (LAN + Direct WAN)</strong><br />
              Fast, Resumable, End-to-End Encrypted File Sharing Across Devices with Zero Server Storage.
            </p>

            ---

            ### 📦 Available Downloads

            | Operating System | Package | Architecture | Description |
            | :--- | :---: | :---: | :--- |
            | **Windows** | `.msi` | x64 (64-bit) | `Raydrop___VERSION___x64_en-US.msi` — Official Windows installer with Explorer context menu |
            | **macOS** | `.dmg` | Universal | `Raydrop___VERSION___universal.dmg` — Native Universal DMG for Apple Silicon (M1–M4) & Intel |
            | **Linux (Debian / Ubuntu)** | `.deb` | x64 (amd64) | `Raydrop___VERSION___amd64.deb` — Debian/Ubuntu package with desktop menu integration |
            | **Linux (Universal)** | `.AppImage` | x64 (amd64) | `Raydrop___VERSION___amd64.AppImage` — Portable standalone binary for all Linux distros |
            | **Android** | `.apk` | ARM64 (`arm64-v8a`) | `Raydrop-arm64-v8a.apk` — Native Android APK for phones and tablets |

            ---

            ### 🚀 Features & Highlights
            - **RayBot Persistent Coding Workspace & Cross-Project Relations:** Configurable projects root (default `~`), persistent SQLite project registry & relation graph, Chat UI workspace bar, and 13 scoped `project_*` / `code_*` MCP tools for Chat UI & Telegram Bot.
            - **Direct RayBot Skills, MCP & Language Tutor Skill:** Install Skills & MCP servers directly onto RayBot across any LLM provider, plus a built-in `language-tutor` skill with dynamic CEFR syllabus and persistent per-language SQLite progress.
            - **LLM Bridge CLI Execution Modes & Extra Flags:** Per-provider execution modes (`YOLO`, `Auto-Edit`, `Safe` with read-only prompt guard) across `agy`, `claude`, `codex`, `gemini`, and `opencode`/custom CLIs, plus custom extra flags.
            - **Image Bridge, Local Vision & ComfyUI + Waifu Persona:** Host-side image storage & local path forwarding to CLIs, automatic Local LLM vision routing, ComfyUI image generation in RayBot Chat UI & Telegram Bot, and a **Waifu Companion** persona style.
            - **All-in-One Web Debugger & Analyzer (Chrome Extension + Desktop):** On-demand web debugging (0% overhead when idle) with **Run Full Audit** (UI/Responsive overflow scan, Web Vitals, Security Headers, Endpoint Ping), **Start/Stop Live Flow Debug**, Overall & Category Score Gauges, SVG Latency/Payload Charts, Rust HTTP Speedtest, and actionable fix recommendations.
            - **Universal Web Share Over Internet (Public Relay Tunnel):** Zero-app browser downloads anywhere in the world via dynamic QR code or web link (`https://stun.raydrop.web.id/share/...`).
            - **1-Click Copy QR Code Image & Social Share:** Direct bitmap copying to clipboard ready to paste into WhatsApp, Telegram, Discord, and 1-tap social share buttons.
            - **In-Chat Clipboard Image Formatting:** Interactive visual cards in chat with 1-click native bitmap copy, file download, and full-resolution lightbox preview modal.
            - **Responsive UI Dashboard:** Streamlined top transfer hub with eliminated overflow and elastic drop zone.
            - **Seamless Universal Clipboard Sync:** Automatically writes directly to the recipient's system clipboard without manual copying. Full support for **Clipboard Images** and Screenshots.
            - **Android P2P Transfer & Magic-Bytes Engine:** Accurate file extension and naming detection directly from Android media pickers.
            - **Zero-Server P2P High-Speed File Transfer:** Direct LAN mDNS & WAN NAT hole-punching with zero cloud file storage.
            - **Parallel Multi-Segment Acceleration:** Up to 6 simultaneous streaming workers for rapid chunk delivery.
            - **End-to-End Cryptographic Security:** ChaCha20-Poly1305 AEAD chunk encryption, BLAKE3 integrity verification, and ephemeral X25519 forward secrecy.
            - **Resumable Transfers (`.raypart`):** Seamless O(1) auto-resume from interrupted connections.
            - **Integrated E2EE Chat & File Sharing:** In-chat file attachments and synchronized transfers.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

