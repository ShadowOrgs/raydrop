<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raydrop Downloader</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --cyan: #06b6d4;
      --cyan-hover: #0891b2;
      --indigo: #6366f1;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      width: 340px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-badge.disconnected {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fb7185;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .quick-input-box {
      margin-bottom: 14px;
    }

    .quick-input-box label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .input-row input {
      flex: 1;
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--cyan);
    }

    .btn {
      padding: 8px 12px;
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .toggle-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-row:not(:last-child) {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toggle-info h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .toggle-info p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .extensions-preview {
      font-size: 10px;
      font-family: monospace;
      color: #64748b;
      line-height: 1.4;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 8px;
      border-radius: 6px;
      word-break: break-all;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    #msgFeedback {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="Raydrop">
      <h1>Raydrop</h1>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="quick-input-box">
    <label>Accelerate Download (IDM Mode)</label>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="Paste HTTP/HTTPS or Magnet link...">
      <button class="btn" id="startBtn">Catch</button>
    </div>
    <div id="msgFeedback"></div>
  </div>

  <div class="toggle-card">
    <div class="toggle-row">
      <div class="toggle-info">
        <h3>Auto-Intercept Downloads</h3>
        <p>Take over browser downloads automatically</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoCaptureToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-info">
        <h3>Extension Enabled</h3>
        <p>Integrate context menu & actions</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="toggle-card" style="margin-bottom: 12px; padding: 10px;">
    <div style="font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 4px;">Captured File Types:</div>
    <div class="extensions-preview" id="extPreview">
      ZIP, RAR, 7Z, ISO, EXE, MSI, APK, MP4, MKV, MP3, PDF, DMG, BIN...
    </div>
  </div>

  <div class="footer">
    <span>Raydrop Engine v1.2</span>
    <a href="https://raydrop.web.id" target="_blank">raydrop.web.id</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
